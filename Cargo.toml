[package]
name = "hdf"
version = "0.17.1"
edition = "2024"
description = "A fuzzy finder for bash history"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", default-features = false, features = ["std", "stdio"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "1"
unicode-width = "0.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# StyleTable's bools are the config's bold, italic, underlined and reversed keys
struct_excessive_bools = "allow"
# Flags pairs like pane and page that are both the right name
similar_names = "allow"
