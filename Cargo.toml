[package]
name = "hdf"
version = "0.13.0"
edition = "2024"
description = "A fuzzy finder for bash history"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", default-features = false, features = ["std", "stdio"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "1"
unicode-width = "0.2"
